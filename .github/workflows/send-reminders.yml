name: Recordatorios push de tareas

"on":
  schedule:
    # Ecuador continental time (UTC-5): 06:00, 10:00, 14:00, 17:00, 19:00.
    - cron: "0 11 * * *"
    - cron: "0 15 * * *"
    - cron: "0 19 * * *"
    - cron: "0 22 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Enviar avisos de tareas que vencen mañana
        env:
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIMS_EMAIL: ${{ secrets.VAPID_CLAIMS_EMAIL }}
          REMINDER_RUN_KEY: ${{ github.event.schedule }}
        run: python send_due_notifications.py
